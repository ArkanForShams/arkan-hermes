<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#263238"/></marker>
    <style>
      .title{font:700 28px Arial;fill:#17202a}.subtitle{font:16px Arial;fill:#455a64}
      .label{font:600 18px Arial;fill:#17202a}.small{font:14px Arial;fill:#37474f}
      .dim{stroke:#263238;stroke-width:2;marker-start:url(#arrow);marker-end:url(#arrow)}
      .ext{stroke:#78909c;stroke-width:1.5;stroke-dasharray:6 5}
      .desk{fill:#20252b;stroke:#111;stroke-width:3}.wall{stroke:#b0bec5;stroke-width:12}
      .guide{fill:none;stroke:#90a4ae;stroke-width:2;stroke-dasharray:8 5}
      .zone{fill:#4fc3f7;fill-opacity:.28;stroke:#0288d1;stroke-width:2}
      .laptop{fill:#b0bec5;stroke:#37474f;stroke-width:2}.monitor{fill:#263238;stroke:#00a6d6;stroke-width:3}
      .leg{fill:#42484d}.bracket{fill:#607d8b;stroke:#263238;stroke-width:2}.note{fill:#fff8e1;stroke:#ffb300;stroke-width:2}
    </style>
  </defs>
  <rect width="1600" height="1100" fill="#f7f9fa"/>
  <text x="70" y="55" class="title">Floating Ergonomic L-Corner WFH Platform — Recommended Fabrication Dimensions</text>
  <text x="70" y="83" class="subtitle">Wall-mounted platform with no floor legs • one 21-inch monitor + two laptops • dimensions in millimetres</text>

  <!-- TOP VIEW -->
  <text x="70" y="135" class="label">TOP VIEW / PLAN</text>
  <line x1="120" y1="160" x2="120" y2="800" class="wall"/><line x1="120" y1="160" x2="850" y2="160" class="wall"/>
  <!-- desk L shape, scaled approx 0.45 -->
  <path d="M120 175 L840 175 L840 760 L210 760 Q165 760 145 720 L120 650 Z" class="desk"/>
  <!-- inner corner / user position -->
  <path d="M390 175 L840 175 L840 468 L430 468 Q390 468 390 428 Z" fill="#3c444b"/>
  <path d="M390 175 L390 428 Q390 468 430 468 L840 468" class="guide"/>
  <text x="485" y="420" class="small" fill="#fff">Inner corner / user zone</text>
  <text x="485" y="443" class="small" fill="#fff">600 × 600 usable corner</text>
  <!-- monitor -->
  <rect x="475" y="205" width="190" height="72" rx="5" class="monitor"/>
  <line x1="570" y1="277" x2="570" y2="320" stroke="#00a6d6" stroke-width="6"/><line x1="535" y1="320" x2="605" y2="320" stroke="#00a6d6" stroke-width="6"/>
  <text x="492" y="245" class="small" fill="#fff">21-inch monitor</text>
  <text x="497" y="265" class="small" fill="#fff">≈ 475 mm wide</text>
  <!-- laptop zones -->
  <rect x="190" y="300" width="190" height="115" rx="5" class="zone"/>
  <rect x="655" y="535" width="155" height="115" rx="5" class="zone"/>
  <rect x="220" y="330" width="130" height="65" class="laptop"/><text x="232" y="367" class="small">Laptop 1</text>
  <rect x="670" y="565" width="125" height="62" class="laptop"/><text x="678" y="601" class="small">Laptop 2</text>
  <!-- chair -->
  <ellipse cx="555" cy="575" rx="92" ry="62" fill="#78909c" fill-opacity=".45" stroke="#455a64" stroke-width="2"/>
  <text x="500" y="580" class="small">chair / seat</text>
  <!-- cable grommets -->
  <circle cx="760" cy="220" r="13" fill="#90a4ae"/><circle cx="230" cy="700" r="13" fill="#90a4ae"/>
  <text x="875" y="220" class="small">Ø60 mm cable grommet</text>
  <!-- dimensions top -->
  <line x1="120" y1="125" x2="840" y2="125" class="dim"/><line x1="120" y1="135" x2="120" y2="175" class="ext"/><line x1="840" y1="135" x2="840" y2="175" class="ext"/><text x="430" y="116" class="label">1600 mm left run</text>
  <line x1="885" y1="175" x2="885" y2="760" class="dim"/><line x1="840" y1="175" x2="895" y2="175" class="ext"/><line x1="840" y1="760" x2="895" y2="760" class="ext"/><text x="900" y="475" class="label" transform="rotate(90 900 475)">1400 mm right run</text>
  <line x1="120" y1="810" x2="420" y2="810" class="dim"/><line x1="120" y1="760" x2="120" y2="820" class="ext"/><line x1="420" y1="468" x2="420" y2="820" class="ext"/><text x="205" y="840" class="label">650 mm depth</text>
  <line x1="430" y1="505" x2="840" y2="505" class="dim"/><text x="540" y="530" class="label">600 mm corner depth</text>
  <!-- notes -->
  <rect x="980" y="150" width="540" height="300" rx="12" class="note"/>
  <text x="1010" y="190" class="label">PLAN RECOMMENDATION</text>
  <text x="1010" y="225" class="small">• Overall footprint: 1600 × 1400 mm</text>
  <text x="1010" y="252" class="small">• Worktop depth: 650 mm minimum</text>
  <text x="1010" y="279" class="small">• Desktop thickness: 25–30 mm</text>
  <text x="1010" y="306" class="small">• Inner corner: 600 × 600 mm clear</text>
  <text x="1010" y="333" class="small">• Front edge: 300–400 mm radius or chamfer</text>
  <text x="1010" y="360" class="small">• Monitor on arm, not a tall fixed shelf</text>
  <text x="1010" y="387" class="small">• Laptop stands raise screens near eye level</text>
  <text x="1010" y="414" class="small">• Keep 100 mm minimum cable access at rear</text>

  <!-- FRONT / SIDE VIEW -->
  <text x="70" y="900" class="label">FRONT / SIDE SECTION</text>
  <line x1="110" y1="1010" x2="850" y2="1010" class="wall"/>
  <rect x="160" y="700" width="650" height="18" class="desk"/>
  <path d="M205 718 L205 820 L350 820" class="bracket"/><path d="M725 718 L725 820 L580 820" class="bracket"/><path d="M310 718 L310 790 L430 790" class="bracket"/><path d="M620 718 L620 790 L500 790" class="bracket"/><line x1="160" y1="735" x2="810" y2="735" stroke="#90a4ae" stroke-width="6"/><text x="365" y="765" class="small">concealed rear ledger / wall cleat</text>
  <rect x="390" y="620" width="190" height="70" rx="5" class="monitor"/><line x1="485" y1="690" x2="485" y2="700" stroke="#00a6d6" stroke-width="6"/>
  <line x1="95" y1="700" x2="95" y2="1010" class="dim"/><line x1="105" y1="700" x2="160" y2="700" class="ext"/><line x1="105" y1="1010" x2="160" y2="1010" class="ext"/><text x="58" y="875" class="label" transform="rotate(-90 58 875)">740 mm desktop height</text>
  <line x1="160" y1="670" x2="810" y2="670" class="dim"/><text x="410" y="660" class="label">650 mm worktop depth</text>
  <text x="855" y="738" class="small">25–30 mm top</text><text x="855" y="765" class="small">620 mm minimum</text><text x="855" y="787" class="small">clear knee height</text>
  <line x1="205" y1="1035" x2="760" y2="1035" class="dim"/><text x="375" y="1065" class="label">No floor legs — maintain open knee space below platform</text>

  <!-- build notes -->
  <rect x="980" y="500" width="540" height="470" rx="12" fill="#e8f5e9" stroke="#43a047" stroke-width="2"/>
  <text x="1010" y="540" class="label">ERGONOMIC BUILD NOTES</text>
  <text x="1010" y="575" class="small">1. Target seated elbow angle: approximately 90°.</text>
  <text x="1010" y="603" class="small">2. Use a continuous rear wall cleat plus heavy-duty brackets.</text>
  <text x="1010" y="631" class="small">3. Top of monitor should be at or slightly below eye level.</text>
  <text x="1010" y="659" class="small">4. Monitor viewing distance: about 550–750 mm.</text>
  <text x="1010" y="687" class="small">5. Use external keyboards and mice for both laptops.</text>
  <text x="1010" y="715" class="small">6. Add a 120 × 100 mm cable tray below the rear edge.</text>
  <text x="1010" y="743" class="small">7. Round all user-facing edges to at least 3 mm radius.</text>
  <text x="1010" y="771" class="small">8. Use brackets rated for at least 100 kg distributed load.</text>
  <text x="1010" y="799" class="small">9. Recommended top: 25 mm plywood/MDF with laminate.</text>
  <text x="1010" y="827" class="small">10. Verify wall squareness before cutting; measure twice.</text>
  <text x="1010" y="875" class="label">Suggested fabrication cut list</text>
  <text x="1010" y="903" class="small">• Left top: 1600 × 650 × 25 mm</text>
  <text x="1010" y="929" class="small">• Right top: 1400 × 650 × 25 mm</text>
  <text x="1010" y="955" class="small">• Support: rear ledger + brackets fixed into wall studs/masonry</text>
</svg>
