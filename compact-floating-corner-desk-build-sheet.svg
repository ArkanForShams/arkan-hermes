<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1050" viewBox="0 0 1600 1050">
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#263238"/></marker><style>.t{font:700 28px Arial;fill:#142027}.h{font:700 19px Arial;fill:#142027}.s{font:14px Arial;fill:#263238}.d{stroke:#263238;stroke-width:2;marker-start:url(#a);marker-end:url(#a)}.e{stroke:#90a4ae;stroke-width:1.5;stroke-dasharray:6 5}.desk{fill:#242a2e;stroke:#111;stroke-width:3}.wall{stroke:#b0bec5;stroke-width:12}.zone{fill:#4fc3f7;fill-opacity:.35;stroke:#0288d1;stroke-width:2}.device{fill:#b0bec5;stroke:#263238;stroke-width:2}.note{fill:#eef7f0;stroke:#43a047;stroke-width:2}.support{fill:#78909c;stroke:#37474f;stroke-width:2}</style></defs>
<rect width="1600" height="1050" fill="#f7f9fa"/>
<text x="55" y="50" class="t">Compact Floating Corner WFH Platform — Build-Ready Geometry</text>
<text x="55" y="78" class="s">27-inch LCD in the corner • two laptops • two mousepads • no floor legs • unobstructed knees</text>
<text x="55" y="125" class="h">TOP PLAN — all dimensions in mm</text>
<!-- walls and desk, schematic scale 0.5 -->
<line x1="100" y1="160" x2="100" y2="720" class="wall"/><line x1="100" y1="160" x2="660" y2="160" class="wall"/>
<path d="M100 176H625L700 251V635L625 710H100V500 Q100 410 190 410 H510 Q600 410 600 320 Q600 230 510 230 H100Z" class="desk"/>
<!-- knee opening highlight -->
<path d="M100 500 Q100 410 190 410 H510 Q600 410 600 320" fill="none" stroke="#ffb300" stroke-width="5" stroke-dasharray="10 6"/>
<text x="180" y="465" class="s" fill="#fff">700 mm seated opening</text><text x="192" y="488" class="s" fill="#fff">smooth concave front</text>
<!-- monitor -->
<rect x="350" y="195" width="155" height="90" rx="5" fill="#263238" stroke="#00a6d6" stroke-width="3"/><line x1="427" y1="285" x2="427" y2="320" stroke="#00a6d6" stroke-width="5"/><text x="363" y="235" class="s" fill="#fff">27-inch LCD</text><text x="361" y="258" class="s" fill="#fff">628 mm envelope</text>
<!-- laptops and mousepads -->
<rect x="145" y="275" width="150" height="105" class="zone"/><rect x="175" y="300" width="100" height="55" class="device"/><text x="182" y="333" class="s">Laptop 1</text><rect x="145" y="385" width="110" height="55" fill="#81d4fa" stroke="#0288d1"/><text x="158" y="418" class="s">220×180 pad</text>
<rect x="510" y="485" width="150" height="105" class="zone"/><rect x="535" y="510" width="100" height="55" class="device"/><text x="542" y="543" class="s">Laptop 2</text><rect x="545" y="575" width="110" height="55" fill="#81d4fa" stroke="#0288d1"/><text x="558" y="608" class="s">220×180 pad</text>
<!-- chair --> <ellipse cx="350" cy="600" rx="85" ry="55" fill="#90a4ae" fill-opacity=".45" stroke="#455a64" stroke-width="2"/><text x="312" y="605" class="s">chair</text>
<!-- dimensions -->
<line x1="100" y1="115" x2="625" y2="115" class="d"/><line x1="100" y1="125" x2="100" y2="176" class="e"/><line x1="625" y1="125" x2="625" y2="176" class="e"/><text x="300" y="108" class="h">1050 mm left run</text>
<line x1="720" y1="176" x2="720" y2="710" class="d"/><line x1="625" y1="176" x2="730" y2="176" class="e"/><line x1="625" y1="710" x2="730" y2="710" class="e"/><text x="738" y="470" class="h" transform="rotate(90 738 470)">1050 mm right run</text>
<line x1="100" y1="760" x2="375" y2="760" class="d"/><text x="170" y="790" class="h">550 mm depth</text>
<line x1="190" y1="435" x2="510" y2="435" class="d"/><text x="255" y="430" class="h">700 mm knee opening</text>
<!-- notes -->
<rect x="850" y="150" width="680" height="280" rx="12" class="note"/><text x="880" y="190" class="h">FINAL TOP-SHEET SPECIFICATION</text><text x="880" y="225" class="s">• 1050 × 1050 mm wall runs; 550 mm worktop depth</text><text x="880" y="252" class="s">• Straight trimmed sides; 150×150 mm outer chamfers</text><text x="880" y="279" class="s">• 700 mm smooth concave seated opening</text><text x="880" y="306" class="s">• 27-inch monitor centred on slim arm</text><text x="880" y="333" class="s">• 360×260 mm laptop zone on each wing</text><text x="880" y="360" class="s">• 220×180 mm mousepad zone on each wing</text><text x="880" y="387" class="s">• R8–R12 rounded user-facing edges</text>
<!-- elevation -->
<text x="55" y="850" class="h">SIDE / FRONT SECTION</text><line x1="90" y1="1000" x2="780" y2="1000" class="wall"/><rect x="145" y="700" width="570" height="18" class="desk"/><line x1="145" y1="730" x2="715" y2="730" stroke="#78909c" stroke-width="7"/><text x="300" y="760" class="s">concealed rear wall cleat</text><path d="M210 718V805H350" class="support"/><path d="M650 718V805H510" class="support"/><line x1="85" y1="700" x2="85" y2="1000" class="d"/><text x="48" y="890" class="h" transform="rotate(-90 48 890)">740 mm height</text><line x1="145" y1="665" x2="715" y2="665" class="d"/><text x="330" y="655" class="h">550 mm depth</text>
<!-- footrest -->
<rect x="300" y="900" width="250" height="30" rx="15" fill="#ffb300" stroke="#8d6e00" stroke-width="2"/><line x1="300" y1="885" x2="550" y2="885" class="d"/><text x="350" y="875" class="h">500 mm foot rail</text><line x1="570" y1="900" x2="570" y2="1000" class="d"/><text x="590" y="955" class="s" transform="rotate(90 590 955)">120–180 mm adjustable height</text><text x="880" y="520" class="h">FOOTREST / SAFETY</text><text x="880" y="550" class="s">• 500 mm wide rounded rail</text><text x="880" y="575" class="s">• 32–40 mm diameter or 220 mm shelf depth</text><text x="880" y="600" class="s">• 150 mm behind front edge</text><text x="880" y="625" class="s">• No bracket inside knee opening</text><text x="880" y="650" class="s">• Feet must move freely around it</text><text x="880" y="675" class="s">• Anchor supports into studs/masonry</text>
<rect x="850" y="720" width="680" height="200" rx="12" class="note"/><text x="880" y="760" class="h">QC GATE BEFORE USE</text><text x="880" y="792" class="s">1. Confirm wall type and anchor points.</text><text x="880" y="820" class="s">2. Confirm 700 mm knee opening and 650 mm clear height.</text><text x="880" y="848" class="s">3. Sit for 30 minutes; no knee, shin, or foot contact.</text><text x="880" y="876" class="s">4. Apply distributed test load before equipment installation.</text><text x="880" y="904" class="s">5. Carpenter must verify wall-load capacity on site.</text>
</svg>
